<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Worksheet Generator</title>
    <link rel="stylesheet" href="style.css" />

    <style>
      .generator-box {
        background: white;
        padding: 24px;
        border-radius: 20px;
        margin: 20px auto;
        max-width: 900px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      }

      textarea {
        width: 90%;
        max-width: 700px;
        height: 120px;
        padding: 14px;
        font-size: 18px;
        border-radius: 12px;
        border: 1px solid #ccc;
      }

      .worksheet-page {
        width: 11in;
        height: 8.5in;
        margin: 30px auto;
        background: white;
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        grid-template-rows: repeat(6, 1fr);
        border: 1px solid black;
        page-break-after: always;
      }
      .worksheet-page:last-child {
        page-break-after: auto;
      }
      .worksheet-cell {
        border: 1px solid black;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        font-family: Arial, sans-serif;
      }

      @media print {
        body * {
          visibility: hidden;
        }

        #worksheetPreview,
        #worksheetPreview * {
          visibility: visible;
        }

        #worksheetPreview {
          position: absolute;
          left: 0;
          top: 0;
        }

        .worksheet-page {
          margin: 0;
          width: 11in;
          height: 8.5in;
        }

        @page {
          size: letter landscape;
          margin: 0;
        }
      }
      .trace-letter {
        color: #d0d0d0;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <a href="index.html" class="back-home">← Back Home</a>

      <h1>Worksheet Generator</h1>

      <div class="generator-box">
        <p>Enter Korean words below. Maximum 20 characters total.</p>

        <p>
          Example:
          <br />
          엄마, 아빠, 이모, 고모
        </p>

        <textarea
          id="wordInput"
          placeholder="Type Korean words here..."
        ></textarea>

        <br /><br />

        <button onclick="generateWorksheet()">Generate Worksheet</button>
        <button onclick="window.print()">Print Worksheet</button>
      </div>

      <div id="worksheetPreview"></div>
    </div>

    <script>
      function generateWorksheet() {
        const input = document.getElementById("wordInput").value;

        const words = input
          .split("\n")
          .map((word) => word.trim())
          .filter((word) => word.length > 0);

        const traceMode = document.getElementById("traceMode").checked;

        const preview = document.getElementById("worksheetPreview");
        preview.innerHTML = "";

        const wordsPerPage = 6;
        const totalPages = Math.ceil(words.length / wordsPerPage);

        for (let pageIndex = 0; pageIndex < totalPages; pageIndex++) {
          const pageWords = words.slice(
            pageIndex * wordsPerPage,
            pageIndex * wordsPerPage + wordsPerPage,
          );

          const page = document.createElement("div");
          page.className = "worksheet-page";

          for (let row = 0; row < 6; row++) {
            const word = pageWords[row] || "";

            for (let col = 0; col < 10; col++) {
              const cell = document.createElement("div");
              cell.className = "worksheet-cell";

              if (col < word.length) {
                cell.textContent = word[col];

                if (traceMode) {
                  cell.classList.add("trace-letter");
                }
              }

              page.appendChild(cell);
            }
          }

          preview.appendChild(page);
        }
      }
    </script>
  </body>
</html>
