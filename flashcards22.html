<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Korean Flashcards</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <nav class="navbar">
      <a href="index.html">🏠 Home</a>
      <a href="lessons.html">🔤 Lessons</a>
      <a href="wordlists.html">📚 Word Lists</a>
      <a href="printables.html">✏️ Worksheets</a>
      <a href="stories.html">📖 Stories</a>
      <a href="flashcards.html" class="active">🃏 Flashcards</a>
      <a href="rewards.html">🏆 Rewards</a>
    </nav>
    <div class="container">
      <h1>🇰🇷 Korean Flashcards</h1>

      <div class="flashcard" onclick="flipCard()">
        <div class="flashcard-inner" id="flashcardInner">
          <div class="flashcard-front">
            <h2 id="englishWord">Loading...</h2>
            <p>Click card to see Korean</p>
          </div>

          <div class="flashcard-back">
            <h2 id="koreanWord">...</h2>
            <p id="pronunciation">...</p>
            <button
              onclick="
                event.stopPropagation();
                speakKorean();
              "
            >
              🔊 Hear Korean
            </button>
          </div>
        </div>
      </div>

      <div class="buttons">
        <button onclick="previousCard()">⬅ Previous</button>
        <button onclick="nextCard()">Next ➡</button>
        <button onclick="randomPracticeCard()">🎲 Random Card</button>
        <button onclick="clearPracticeCard()">✅ Done / Clear Card</button>
      </div>

      <hr />

      <h2>Add or Edit Words</h2>

      <input type="text" id="englishInput" placeholder="English word" />
      <input type="text" id="koreanInput" placeholder="Korean word" />
      <input type="text" id="pronunciationInput" placeholder="Pronunciation" />

      <div class="buttons">
        <button onclick="addWord()">➕ Add Word</button>
        <button onclick="updateWord()">✏️ Update Current</button>
        <button onclick="deleteWord()">🗑 Delete Current</button>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
    <script>
      function setCardText(english, korean, pronunciation, hint) {
        document.getElementById("englishWord").textContent = english;
        document.getElementById("koreanWord").textContent = korean;
        document.getElementById("pronunciation").textContent = pronunciation;

        const frontHint = document.querySelector(".flashcard-front p");
        if (frontHint) frontHint.textContent = hint;

        document.getElementById("flashcardInner").classList.remove("flipped");
      }

      function clearPracticeCard() {
        setCardText(
          "Practice finished!",
          "잘했어요!",
          "Good job!",
          "Click Random Card to practice another word"
        );

        document.getElementById("englishInput").value = "";
        document.getElementById("koreanInput").value = "";
        document.getElementById("pronunciationInput").value = "";
      }

      function showCurrentPracticeCard() {
        if (typeof displayCard === "function") {
          displayCard();
          return;
        }

        if (typeof showCard === "function") {
          showCard();
          return;
        }

        if (typeof updateCard === "function") {
          updateCard();
          return;
        }

        const card = words[currentIndex];
        setCardText(
          card.english || card.englishWord || "",
          card.korean || card.koreanWord || "",
          card.pronunciation || "",
          "Click card to see Korean"
        );
      }

      function randomPracticeCard() {
        if (typeof words === "undefined" || !Array.isArray(words) || words.length === 0) {
          setCardText(
            "No words yet",
            "...",
            "...",
            "Add words first, then try Random Card"
          );
          return;
        }

        if (words.length === 1) {
          currentIndex = 0;
        } else {
          let randomIndex;
          do {
            randomIndex = Math.floor(Math.random() * words.length);
          } while (randomIndex === currentIndex);
          currentIndex = randomIndex;
        }

        showCurrentPracticeCard();
        document.getElementById("flashcardInner").classList.remove("flipped");
      }
    </script>
    <footer class="footer">
      <p>© 2026 Halmoni Tells</p>
    </footer>
  </body>
</html>
