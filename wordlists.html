<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Lists</title>
    <link rel="stylesheet" href="style.css" />

    <style>
      .word-section {
        background: white;
        border-radius: 18px;
        padding: 22px;
        margin: 22px auto;
        max-width: 1000px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      }

      .word-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 14px;
        margin-top: 18px;
      }

      .word-card {
        background: #f0f8ff;
        border-radius: 18px;
        padding: 18px 10px;
        text-align: center;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      }

      .word-emoji {
        font-size: 34px;
      }

      .word-korean {
        font-size: 26px;
        font-weight: bold;
        margin-top: 8px;
      }

      .word-english {
        font-size: 16px;
        color: #555;
        margin-top: 4px;
      }

      .simple-list {
        display: block;
        max-width: 500px;
        margin: 18px auto 0;
      }

      .simple-row {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid #eee;
        padding: 10px 6px;
        font-size: 24px;
      }

      .simple-korean {
        font-weight: bold;
      }

      .simple-english {
        color: #555;
      }
    </style>
  </head>

  <body>
    <nav class="navbar">
      <a href="index.html">🏠 Home</a>

      <a href="flashcards.html">🃏 Flashcards</a>

      async function loadWordLists() {
        const response = await fetch("wordlists/kids_words.json");
        const data = await response.json();

        const container = document.getElementById("wordListContainer");
        container.innerHTML = "";

        createWordSection(categoryNames.responses, data.others.responses, true);
        createWordSection(categoryNames.colors, data.others.colors, false);
        createWordSection(categoryNames.numbers, data.others.numbers, false);

        for (const category in data.nouns) {
          createWordSection(
            categoryNames[category],
            data.nouns[category],
            false,
          );
        }

        createWordSection(categoryNames.verbs, data.verbs, true);
        createWordSection(
          categoryNames.descriptions,
          data.others.descriptions,
          true,
        );
      }

      function createWordSection(title, words, simpleList) {
        const container = document.getElementById("wordListContainer");

        const section = document.createElement("section");
        section.className = "word-section";

        const heading = document.createElement("h2");
        heading.textContent = title;

        const grid = document.createElement("div");
        grid.className = simpleList ? "simple-list" : "word-grid";

        words.forEach((word) => {
          const info = wordInfo[word] || ["", ""];

          if (simpleList) {
            const row = document.createElement("div");
            row.className = "simple-row";

            row.innerHTML = `
            <span class="simple-korean">${word}</span>
            <span class="simple-english">${info[0]}</span>
          `;

            grid.appendChild(row);
          } else {
            const card = document.createElement("div");
            card.className = "word-card";

            card.innerHTML = `
            <div class="word-emoji">${info[1]}</div>
            <div class="word-korean">${word}</div>
            <div class="word-english">${info[0]}</div>
          `;

            grid.appendChild(card);
          }
        });

        section.appendChild(heading);
        section.appendChild(grid);
        container.appendChild(section);
      }

      loadWordLists();
    </script>
