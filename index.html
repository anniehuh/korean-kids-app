<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Korean Flashcards</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>🇰🇷 Korean Flashcards</h1>

    <div class="card">
      <h2 id="englishWord">Apple</h2>
      <h3 id="koreanWord">사과</h3>
      <p id="pronunciation">sagwa</p>
    </div>

    <div class="buttons">
      <button onclick="previousCard()">⬅ Previous</button>
      <button onclick="nextCard()">Next ➡</button>
    </div>

    <hr />

    <h2>Add or Edit Words</h2>

    <input type="text" id="englishInput" placeholder="English word" />
    <input type="text" id="koreanInput" placeholder="Korean word" />
    <input type="text" id="pronunciationInput" placeholder="Pronunciation" />

    <div class="buttons">
      <button onclick="addWord()">➕ Add Word</button>
      <button onclick="updateWord()">✏️ Update Current</button>
      <button onclick="deleteWord()">🗑 Delete Current</button>
    </div>

  </div>

 <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
